# Mojo Configuration
# Location: ~/.mojo/config.yaml

extraction:
  # LLM backend: claude-cli (headless `claude -p`, 구독 — API 비용 0, 기본값)
  #              codex-cli (headless `codex exec`, 구독 — API 비용 0)
  #              api (Anthropic API, ANTHROPIC_API_KEY 필요, --batch 지원)
  backend: claude-cli
  models:
    claude-cli: { filter: haiku, structure: sonnet }
    codex-cli:  { filter: null,  structure: null }   # null → codex 기본 모델
    api:        { filter: "claude-haiku-4-5-20251001",
                  structure: "claude-sonnet-4-6" }
  cli_timeout_s: 600              # headless CLI 호출 타임아웃
  auto_extract: true              # SessionEnd hook이 백그라운드 추출을 띄울지
  min_turns: 5                    # 이 미만 세션 스킵
  max_session_tokens: 20000       # 초과 시 요약 후 추출

vault:
  path: ~/mojo-vault              # Obsidian vault 위치 (md가 인간 편집의 진실)

serving:
  token_budget: 3000              # MOJO.md advisory context token budget
  skill_threshold: 10             # legacy explicit sync only
  auto_sync: false                # do not auto-mutate human instruction files
  confidence_threshold: 0.5       # legacy explicit sync threshold

quality:
  auto_archive_days: 180
  min_confidence: 0.3
  require_approval: true          # strong promotion requires review

costs:
  track_costs: true
  monthly_budget_usd: 10.0        # 초과 시 추출 중단

domains: []
  # 도메인별 우선순위. 예:
  # - path: "electricity/smp"
  #   priority: 1.0
  # - path: "ml/timeseries"
  #   priority: 0.8
